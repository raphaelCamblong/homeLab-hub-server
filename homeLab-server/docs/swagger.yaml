  /api/v1/services/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a service by its ID
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Service deleted successfully
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a service
      tags:
      - services
    get:
      consumes:
      - application/json
      description: Get a single service by its ID
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.ServiceEntity'
      security:
      - BearerAuth: []
      summary: Get a service by ID
      tags:
      - services
    put:
      consumes:
      - application/json
      description: Update a service with the provided information
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      - description: Service object
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.ServiceEntity'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.ServiceEntity'
      security:
      - BearerAuth: []
      summary: Update a service
      tags:
      - services
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Get paginated list of all users
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
              users:
                items:
                  $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.UserResponse'
                type: array
            type: object
        "500":
