paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.UserCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.AuthResponse'
        "400":
          description: Invalid request format
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            properties:
              error:
                type: string
            type: object
      summary: User login
      tags:
      - authentication
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate user's current session
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            properties:
              message:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.UserCredentials'
      produces:
      - application/json
      responses:
        "201":
          description: JWT token
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.AuthResponse'
        "400":
          description: Invalid request format or validation error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Register new user
      tags:
      - authentication
  /api/v1/pipelines:
    get:
      consumes:
      - application/json
      description: Get all pipeline templates
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
            type: array
      security:
      - BearerAuth: []
      summary: List all pipeline templates
      tags:
      - pipelines
    post:
      consumes:
      - application/json
      description: Create a new pipeline template
      parameters:
      - description: Template object
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
      security:
      - BearerAuth: []
      summary: Create a new pipeline template
      tags:
      - pipelines
  /api/v1/pipelines/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a pipeline template by ID
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Template deleted successfully
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a pipeline template
      tags:
      - pipelines
    get:
      consumes:
      - application/json
      description: Get a single pipeline template by its ID
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
      security:
      - BearerAuth: []
      summary: Get a pipeline template by ID
      tags:
      - pipelines
    put:
      consumes:
      - application/json
      description: Update a pipeline template by ID
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      - description: Template object
        in: body
        name: template
        required: true
        schema:
          $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.PipelineTemplate'
      security:
      - BearerAuth: []
      summary: Update a pipeline template
      tags:
      - pipelines
  /api/v1/pipelines/{id}/jobs:
    get:
      consumes:
      - application/json
      description: Get all execution jobs for a specific pipeline
      parameters:
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.Job'
            type: array
      security:
      - BearerAuth: []
      summary: List all jobs for a pipeline
      tags:
      - pipelines
    post:
      consumes:
      - application/json
      description: Create a new execution job for a pipeline
      parameters:
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.Job'
      security:
      - BearerAuth: []
      summary: Create a new job for a pipeline
      tags:
      - pipelines
  /api/v1/pipelines/{id}/jobs/complete:
    post:
      consumes:
      - application/json
      description: Mark all running jobs as completed for a specific pipeline
      parameters:
      - description: Pipeline ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Jobs completed successfully
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Complete all running jobs for a pipeline
      tags:
      - pipelines
  /api/v1/pipelines/jobs:
    get:
      consumes:
      - application/json
      description: Get all execution jobs for all pipelines
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.Job'
            type: array
      security:
      - BearerAuth: []
      summary: List all jobs across all pipelines
      tags:
      - pipelines
  /api/v1/pipelines/jobs/{jobId}:
    get:
      consumes:
      - application/json
      description: Get details of a specific job by its ID
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.Job'
      security:
      - BearerAuth: []
      summary: Get a specific job
      tags:
      - pipelines
  /api/v1/pipelines/jobs/{jobId}/stop:
    post:
      consumes:
      - application/json
      description: Stop a specific job by its ID
      parameters:
      - description: Job ID
        in: path
        name: jobId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Job stopped successfully
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Stop a specific job
      tags:
      - pipelines
  /api/v1/pipelines/jobs/stream:
    get:
      consumes:
      - application/json
      description: Get real-time updates for pipeline jobs via Server-Sent Events
        (SSE).
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream of job updates
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gin.H'
      security:
      - BearerAuth: []
      summary: Stream job updates
      tags:
      - pipelines
  /api/v1/services:
    get:
      consumes:
      - application/json
      description: Get all services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/homelab_com_homelab-server_homeLab-server_internal_entities.ServiceEntity'
            type: array
      security:
      - BearerAuth: []
      summary: List all services
      tags:
      - services
    post:
      consumes:
      - application/json
      description: Create a new service with the provided information
      parameters:
      - description: Service object
